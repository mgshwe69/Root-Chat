name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.0'
          channel: 'stable'

      - name: Flutter Create Android
        run: flutter create --project-name root --org com.mg1 . --platforms=android

      - name: Setup Firebase Config
        run: |
          mkdir -p android/app
          echo '${{ secrets.GOOGLE_SERVICES_JSON }}' > android/app/google-services.json

      - name: Add Google Services Plugin
        run: |
          # Add classpath to project-level build.gradle
          sed -i 's|dependencies {|dependencies {\n        classpath "com.google.gms:google-services:4.4.0"|' android/build.gradle
          
          # Add apply plugin to app-level build.gradle
          sed -i 's|apply plugin: "com.android.application"|apply plugin: "com.android.application"\napply plugin: "com.google.gms.google-services"|' android/app/build.gradle
          
          echo "=== android/build.gradle ==="
          cat android/build.gradle
          echo "=== android/app/build.gradle (first 30 lines) ==="
          head -30 android/app/build.gradle

      - name: Install dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: root-apk
          path: build/app/outputs/flutter-apk/app-release.apk
